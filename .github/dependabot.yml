version: 2
updates:
  # Bumps the SHA-pinned actions in .github/workflows and their "# vX.Y.Z" comments.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # pnpm workspace (root pnpm-lock.yaml). The vendored SheetJS tarball (vendor/) is not on the
  # npm registry and is upgraded by hand — see vendor/README.md.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: xlsx
      # Node runs 22 on CI and Cloudflare Pages: newer @types/node would allow APIs Node 22 lacks.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Pinned to the major that @duckdb/duckdb-wasm depends on; upgrade together with DuckDB-WASM.
      - dependency-name: apache-arrow
        update-types: ['version-update:semver-major']
      # E2E runs on the Chromium preinstalled in the cloud dev environment (/opt/pw-browsers,
      # revision 1243); @playwright/test 1.64.1 is accepted on it (MEMORY 2026-11-04). Newer versions
      # expect another Chromium: upgrade by hand, with a full E2E run, when that Chromium changes.
      - dependency-name: '@playwright/test'
