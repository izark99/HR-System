name: Supabase backup

# Supabase Free keeps no backups (spec §16). Once a week this dumps the data of schema `public`
# (flows, versions, reference tables, edited UI texts, profiles, groups, logs), proves the dump
# restores into a database built from supabase/migrations (scripts/backup/dump-and-verify.sh),
# encrypts it and keeps it as a workflow artifact for 90 days.
#
# The repository is public, so anyone signed in to GitHub can download artifacts and read these
# logs: only the ENCRYPTED file is uploaded, and the script prints table names and row counts only.
#
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL    "Session pooler" connection string of the project, with the database
#                      password (the direct connection is IPv6 only; GitHub runners have no IPv6)
#   BACKUP_PASSPHRASE  passphrase of the encryption; without it a backup cannot be read
#
# Restore: see README, "Sao lưu và khôi phục".
# Note: GitHub disables scheduled workflows after 60 days without repository activity.

on:
  schedule:
    - cron: '23 18 * * 6' # Sunday 01:23 Vietnam time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Throw-away database the dump is restored into. Same major version as the Supabase project.
      scratch:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that both secrets are set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "::error::Secret SUPABASE_DB_URL is missing"; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo "::error::Secret BACKUP_PASSPHRASE is missing"; exit 1; }

      # pg_dump / psql come from the postgres:17 image, so they always match the server version.
      - name: Dump the data and verify that it restores
        env:
          SOURCE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p "$RUNNER_TEMP/backup"
          docker run --rm --network host \
            -e SOURCE_DB_URL \
            -e SCRATCH_DB_URL=postgresql://postgres:scratch@localhost:5432/postgres \
            -e OUT_FILE=/out/hrflow-data.sql \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/backup:/out" \
            postgres:17 bash /repo/scripts/backup/dump-and-verify.sh

      - name: Encrypt the dump and remove the plain file
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          cd "$RUNNER_TEMP/backup"
          sudo chown "$(id -u)" hrflow-data.sql
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 \
            -o "hrflow-data-$(date -u +%Y%m%d).sql.gpg" hrflow-data.sql 3<<<"$BACKUP_PASSPHRASE"
          rm -f hrflow-data.sql
          ls -1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hrflow-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/backup/*.sql.gpg
          if-no-files-found: error
          retention-days: 90
