name: Supabase keep-alive

# Supabase Free pauses a project after 7 days without activity (spec §16). One cheap request a
# day keeps it awake. The request uses only the publishable key (public, same as the web app);
# RLS returns no rows to anon, so nothing is exposed.
# Note: GitHub disables scheduled workflows after 60 days without repository activity; re-enable
# it under Actions if that happens.

on:
  schedule:
    - cron: '7 1 * * *' # 08:07 Vietnam time
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://rzakjtgvbyxqsmbpcomw.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_LGUaSHynCBDHgwpW0AEe4g_6woV3e4K
    steps:
      - name: Ping Supabase REST
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/app_settings?select=key&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "HTTP $status"
          test "$status" = 200
